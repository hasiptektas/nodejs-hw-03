openapi: 3.1.0
info:
  version: 1.0.0
  title: Contact Management API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: >
    Contact Management API - Kişi yönetimi için RESTful API
tags:
  - name: Contacts
    description: Kişi yönetimi işlemleri
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://nodejs-hw-03.onrender.com
    description: Production server
paths:
  /contacts:
    get:
      $ref: './swagger/paths/contacts/get.yaml'
    post:
      $ref: './swagger/paths/contacts/post.yaml'
  /contacts/{id}:
    get:
      $ref: './swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: './swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: './swagger/paths/contacts/{id}/delete.yaml'
components:
  schemas:
    Contact:
      type: object
      properties:
        id:
          type: string
          description: Kişi ID'si
        name:
          type: string
          description: Kişi adı
        email:
          type: string
          format: email
          description: E-posta adresi
        phone:
          type: string
          description: Telefon numarası
        favorite:
          type: boolean
          description: Favori durumu
        createdAt:
          type: string
          format: date-time
          description: Oluşturulma tarihi
        updatedAt:
          type: string
          format: date-time
          description: Güncellenme tarihi
      required:
        - name
        - email
        - phone
    ContactCreate:
      type: object
      properties:
        name:
          type: string
          description: Kişi adı
        email:
          type: string
          format: email
          description: E-posta adresi
        phone:
          type: string
          description: Telefon numarası
        favorite:
          type: boolean
          description: Favori durumu
          default: false
      required:
        - name
        - email
        - phone
    ContactUpdate:
      type: object
      properties:
        name:
          type: string
          description: Kişi adı
        email:
          type: string
          format: email
          description: E-posta adresi
        phone:
          type: string
          description: Telefon numarası
        favorite:
          type: boolean
          description: Favori durumu
    Error:
      type: object
      properties:
        message:
          type: string
          description: Hata mesajı
        status:
          type: integer
          description: HTTP durum kodu
      required:
        - message
        - status
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer 
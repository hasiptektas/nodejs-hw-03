tags:
  - Contacts
summary: Bir kişiyi siler
operationId: deleteContact
description: Verilen ID'ye sahip kişiyi sistemden siler
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: Kişi ID'si
responses:
  '204':
    description: Kişi başarıyla silindi
  '401':
    description: Yetkisiz erişim
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  '404':
    description: Kişi bulunamadı
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error' 